# Shadowcut local stack. Everything runs locally; no cloud resources are used.
# Host ports use the 1xxxx range to avoid clashing with locally installed services.
name: shadowcut

x-go-service: &go-service
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  image: shadowcut:dev
  env_file: ../.env
  restart: unless-stopped

services:
  postgres:
    image: postgres:16
    env_file: ../.env
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
      - -c
      - shared_preload_libraries=pg_stat_statements
    ports: ["15432:5432"]
    volumes:
      - ../schema/postgres.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      retries: 30

  # Spanner emulator + PGAdapter in one container. PGAdapter (port 5432) speaks the
  # PostgreSQL wire protocol; the emulator's gRPC endpoint (9010) is used by the CDC applier.
  spanner:
    image: gcr.io/cloud-spanner-pg-adapter/pgadapter-emulator:latest
    ports: ["15433:5432", "19010:9010"]

  kafka:
    image: apache/kafka:3.9.0
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,TOXI://:9093,HOST://:9094,CONTROLLER://:9095
      # TOXI is advertised through toxiproxy so network faults can be injected
      # between the applier and the broker.
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,TOXI://toxiproxy:29093,HOST://localhost:19094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,TOXI:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9095
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 4
    ports: ["19094:9094"]

  connect:
    image: quay.io/debezium/connect:3.0
    depends_on: [kafka, postgres]
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: shadowcut-connect
      CONFIG_STORAGE_TOPIC: _connect_configs
      OFFSET_STORAGE_TOPIC: _connect_offsets
      STATUS_STORAGE_TOPIC: _connect_status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    ports: ["18083:8083"]

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    volumes:
      - ./toxiproxy/toxiproxy.json:/config/toxiproxy.json:ro
    ports: ["18474:8474"]

  applier:
    <<: *go-service
    command: ["sc-applier"]
    environment:
      KAFKA_BROKERS: toxiproxy:29093
      SPANNER_EMULATOR_HOST: toxiproxy:29010
      METRICS_ADDR: ":9464"
    depends_on: [kafka, spanner, toxiproxy]
    profiles: ["cdc", "full"]

  ingest-wiki:
    <<: *go-service
    command: ["sc-ingest", "wiki"]
    environment:
      PG_DSN: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      METRICS_ADDR: ":9464"
    depends_on: [postgres]
    profiles: ["ingest", "full"]

  shadow:
    <<: *go-service
    command: ["shadowcut", "shadow", "proxy", "--listen", ":5432", "--out", "/state/shadow"]
    environment:
      PG_DSN: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      SPANNER_DSN: postgres://spanner:5432/${SPANNER_DATABASE}?sslmode=disable
      METRICS_ADDR: ":9464"
    volumes: ["../state:/state"]
    ports: ["15435:5432"]
    depends_on: [postgres, spanner]
    profiles: ["full"]

  demoapp:
    <<: *go-service
    command: ["sc-demoapp"]
    environment:
      PG_DSN: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      READ_DSN: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@shadow:5432/${POSTGRES_DB}?sslmode=disable
      SPANNER_DSN: postgres://spanner:5432/${SPANNER_DATABASE}?sslmode=disable
      LISTEN: ":8080"
      METRICS_ADDR: ":9464"
    ports: ["18080:8080"]
    depends_on: [postgres, spanner]
    profiles: ["full"]

  prometheus:
    image: prom/prometheus:v2.55.0
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["19090:9090"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    profiles: ["obs", "full"]

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["13000:3000"]
    profiles: ["obs", "full"]

volumes:
  pgdata:
